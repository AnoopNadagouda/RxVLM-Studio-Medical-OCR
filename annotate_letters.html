<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Annotator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1e1e2e;--surface:#181825;--overlay:#313244;--text:#cdd6f4;--subtext:#a6adc8;--accent:#89b4fa;--accent2:#f38ba8;--green:#a6e3a1;--yellow:#f9e2af;--orange:#fab387;--border:#45475a;--radius:6px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}
#sidebar{width:280px;min-width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
#sidebar .controls{padding:12px;border-bottom:1px solid var(--border)}
#sidebar .controls select,#sidebar .controls input{width:100%;background:var(--overlay);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:6px 8px;font-size:13px;margin-bottom:6px;outline:none}
#sidebar .controls select:focus,#sidebar .controls input:focus{border-color:var(--accent)}
#sidebar .controls select option{background:var(--overlay);color:var(--text)}
.filter-btns{display:flex;gap:4px;margin-bottom:6px}
.filter-btns button{flex:1;background:var(--overlay);color:var(--subtext);border:1px solid var(--border);border-radius:4px;padding:4px 6px;cursor:pointer;font-size:11px;transition:background .15s,color .15s}
.filter-btns button:hover{background:var(--border);color:var(--text)}
.filter-btns button.active{background:var(--accent);color:#11111b;border-color:var(--accent)}
#statsBar{padding:6px 12px;font-size:11px;color:var(--subtext);border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
#statsBar span{white-space:nowrap}
#statsBar .stat-total{color:var(--text)}
#statsBar .stat-extracted{color:var(--green)}
#statsBar .stat-skipped{color:var(--accent2)}
#fileList{flex:1;overflow-y:auto;padding:4px}
#fileList::-webkit-scrollbar{width:6px}
#fileList::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.fi{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:var(--radius);cursor:pointer;transition:background .15s;border-left:3px solid transparent}
.fi:hover{background:var(--overlay)}
.fi.active{background:var(--overlay);outline:2px solid var(--accent);outline-offset:-1px}
.fi.extracted{border-left-color:var(--green)}
.fi.skipped{border-left-color:var(--accent2)}
.fi.modified{border-left-color:var(--yellow)}
.fi .thumb{width:36px;height:36px;object-fit:contain;border-radius:3px;background:#11111b;flex-shrink:0}
.fi .fn{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .sc{font-size:10px;color:var(--subtext);flex-shrink:0}
.fi .skipped-badge{font-size:9px;background:var(--accent2);color:#11111b;padding:1px 4px;border-radius:3px;font-weight:700}
#center{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#toolbar{height:40px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0}
#toolbar button{background:var(--overlay);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer;font-size:13px;transition:background .15s}
#toolbar button:hover{background:var(--border)}
#toolbar button.active{background:var(--accent);color:#11111b;border-color:var(--accent)}
#toolbar button:disabled{opacity:.4;cursor:default}
#toolbar .sep{width:1px;height:20px;background:var(--border)}
.kb-hint{font-size:10px;color:var(--subtext);margin-left:2px}
#statusText{font-size:12px;color:var(--subtext);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#imgWrap{flex:1;overflow:auto;position:relative;background:#11111b;display:flex;align-items:flex-start;justify-content:center}
#imgContainer{position:relative;display:inline-block;margin:20px;transform-origin:0 0}
#mainImg{display:block;cursor:default;user-select:none;-webkit-user-drag:none}
#boxesOverlay{position:absolute;inset:0;pointer-events:none}
.word-box{position:absolute;border:1.5px dashed rgba(166,173,200,.35);pointer-events:none}
.box{position:absolute;border:2px solid var(--accent2);pointer-events:auto;cursor:move;min-width:4px;min-height:4px}
.box.selected{outline:2px solid var(--accent);outline-offset:1px;z-index:10}
.box .lbl{position:absolute;bottom:100%;left:0;font-size:10px;background:rgba(0,0,0,.8);color:#fff;padding:1px 4px;border-radius:2px;white-space:nowrap;pointer-events:none}
.box .lbl.below{bottom:auto;top:100%}
.rh{position:absolute;width:8px;height:8px;background:var(--accent);border:1px solid #fff;pointer-events:auto;z-index:20}
.rh.tl{top:-4px;left:-4px;cursor:nwse-resize}
.rh.tr{top:-4px;right:-4px;cursor:nesw-resize}
.rh.bl{bottom:-4px;left:-4px;cursor:nesw-resize}
.rh.br{bottom:-4px;right:-4px;cursor:nwse-resize}
.rh.tm{top:-4px;left:50%;transform:translateX(-50%);cursor:ns-resize}
.rh.bm{bottom:-4px;left:50%;transform:translateX(-50%);cursor:ns-resize}
.rh.ml{top:50%;left:-4px;transform:translateY(-50%);cursor:ew-resize}
.rh.mr{top:50%;right:-4px;transform:translateY(-50%);cursor:ew-resize}
#drawBox{position:absolute;border:2px dashed var(--accent);pointer-events:none;display:none;z-index:30;background:rgba(137,180,250,.1)}
#rightPanel{width:300px;min-width:300px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.rp-section{padding:8px 12px;border-bottom:1px solid var(--border)}
.rp-section .rp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--subtext);margin-bottom:6px}
.rp-section .info-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px}
.rp-section .info-label{color:var(--subtext);min-width:60px;flex-shrink:0}
.rp-section .info-value{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-section input[type=text],.rp-section textarea{width:100%;background:var(--overlay);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;outline:none;font-family:inherit}
.rp-section input[type=text]:focus,.rp-section textarea:focus{border-color:var(--accent)}
.rp-section textarea{resize:vertical;min-height:40px}
#segmentsList{flex:1;overflow-y:auto;padding:4px 8px}
#segmentsList::-webkit-scrollbar{width:6px}
#segmentsList::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.seg-item{display:flex;align-items:center;gap:6px;padding:5px;border-radius:var(--radius);margin-bottom:3px;background:var(--overlay);border-left:3px solid transparent;transition:outline .15s,background .15s;cursor:pointer}
.seg-item:hover{background:rgba(49,50,68,.9)}
.seg-item.selected{outline:2px solid var(--accent)}
.seg-item .seg-crop{width:32px;height:32px;object-fit:contain;border-radius:3px;background:#11111b;flex-shrink:0}
.seg-item .seg-crop-placeholder{width:32px;height:32px;border-radius:3px;background:#11111b;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--subtext)}
.seg-item .seg-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.seg-item .seg-char{width:36px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px;padding:2px 4px;font-size:14px;text-align:center;outline:none;font-family:monospace}
.seg-item .seg-char:focus{border-color:var(--accent)}
.seg-item .seg-coords{font-size:10px;color:var(--subtext);font-family:monospace}
.seg-item .seg-del{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:16px;padding:0 2px;flex-shrink:0;line-height:1;opacity:.6;transition:opacity .15s}
.seg-item .seg-del:hover{opacity:1;color:#fff}
#wbList{max-height:120px;overflow-y:auto;padding:0 8px 8px}
#wbList::-webkit-scrollbar{width:6px}
#wbList::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.wb-item{font-size:11px;color:var(--subtext);padding:2px 4px;font-family:monospace;border-bottom:1px solid rgba(69,71,90,.3)}
#loadingOverlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999}
#loadingOverlay.show{display:flex}
#loadingOverlay .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--overlay);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 16px;font-size:13px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.error{border-color:var(--accent2);color:var(--accent2)}
.toast.success{border-color:var(--green);color:var(--green)}
.inline-edit{position:absolute;z-index:50;background:var(--overlay);border:2px solid var(--accent);border-radius:3px;padding:2px 4px;font-size:14px;color:var(--text);font-family:monospace;text-align:center;outline:none;width:30px}
</style>
</head>
<body>
<div id="sidebar">
  <div class="controls">
    <select id="datasetFilter"><option value="">All Datasets</option></select>
    <div class="filter-btns">
      <button id="filterAll" class="active">All</button>
      <button id="filterExtracted">Extracted</button>
      <button id="filterSkipped">Skipped</button>
    </div>
    <input type="text" id="searchInput" placeholder="Search by label or stem...">
  </div>
  <div id="statsBar"></div>
  <div id="fileList"></div>
</div>
<div id="center">
  <div id="toolbar">
    <button id="btnPrev" title="Previous (←)">◀</button>
    <button id="btnNext" title="Next (→)">▶</button>
    <div class="sep"></div>
    <button id="btnSave" title="Save (Ctrl+S)">💾 Save</button>
    <button id="btnSkip" title="Skip/Unskip (S)">⊘ Skip</button>
    <div class="sep"></div>
    <button id="btnDraw" title="Draw mode (D)">✏ Draw</button>
    <div class="sep"></div>
    <button id="btnZoomIn" title="Zoom in (+)">+</button>
    <button id="btnZoomOut" title="Zoom out (-)">−</button>
    <button id="btnZoomFit" title="Fit (0)">Fit</button>
    <div class="sep"></div>
    <button id="btnCopyImg" title="Copy original image to clipboard (C)">📋 Copy Img</button>
    <span id="statusText">Ready</span>
  </div>
  <div id="imgWrap">
    <div id="imgContainer">
      <img id="mainImg" src="" alt="">
      <div id="boxesOverlay"></div>
      <div id="drawBox"></div>
    </div>
    <div id="loadingOverlay"><div class="spinner"></div></div>
  </div>
</div>
<div id="rightPanel">
  <div class="rp-section">
    <div class="rp-title">Source Info</div>
    <div class="info-row"><span class="info-label">Dataset</span><span class="info-value" id="infoDataset">—</span></div>
    <div class="info-row"><span class="info-label">Method</span><span class="info-value" id="infoMethod">—</span></div>
    <div class="info-row"><span class="info-label">Label</span><input type="text" id="infoLabel" placeholder="Label text"></div>
    <div class="info-row"><span class="info-label">Skip</span><span class="info-value" id="infoSkip">—</span></div>
  </div>
  <div class="rp-section" style="padding-bottom:4px">
    <div class="rp-title">Letter Segments (<span id="segCount">0</span>)</div>
  </div>
  <div id="segmentsList"></div>
  <div class="rp-section" style="padding-bottom:4px">
    <div class="rp-title">Word Boxes (<span id="wbCount">0</span>)</div>
  </div>
  <div id="wbList"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API = 'http://localhost:8787/api';

// ── State ──
let images = [];        // current page of image list items
let imagesTotal = 0;
let currentStem = null; // stem of currently loaded image
let currentData = null; // full image data from /api/image/{stem}
let segments = [];      // working copy of segments
let wordBoxes = [];
let selectedIdx = -1;
let modified = false;
let drawMode = false;
let drawing = false;
let drawStart = null;
let drawCurrent = null;
let dragging = false;
let dragType = null;    // 'move' | 'resize-tl' etc.
let dragStartMouse = null;
let dragOrigSeg = null;
let zoom = 1;
let panX = 0, panY = 0;
let panning = false;
let panStart = null;
let panStartOffset = null;
let loadingCount = 0;
let listSkip = 0;
let listFilter = 'all';
let listDataset = '';
let listSearch = '';
let inlineEditEl = null;

// ── Helpers ──
function $(id){ return document.getElementById(id) }

function setLoading(v){
  loadingCount += v ? 1 : -1;
  if(loadingCount < 0) loadingCount = 0;
  $('loadingOverlay').classList.toggle('show', loadingCount > 0);
}

function showToast(msg, type){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2500);
}

function setModified(v){
  modified = v;
  updateStatus();
  updateFileListItem();
}

function updateStatus(){
  let s = '';
  if(currentStem){
    if(modified) s = '● Modified';
    else if(currentData?.skipped) s = '⊘ Skipped';
    else s = '✓ Loaded';
    s += ` — ${Math.round(zoom*100)}%`;
  } else {
    s = 'Ready';
  }
  $('statusText').textContent = s;
}

async function fetchJson(url){
  setLoading(true);
  try{ const r = await fetch(url); if(!r.ok) throw new Error(r.statusText); return await r.json(); }
  finally{ setLoading(false); }
}

async function postJson(url, data){
  setLoading(true);
  try{ const r = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error(r.statusText); return await r.json(); }
  finally{ setLoading(false); }
}

async function delJson(url){
  setLoading(true);
  try{ const r = await fetch(url, {method:'DELETE'}); if(!r.ok) throw new Error(r.statusText); return await r.json(); }
  finally{ setLoading(false); }
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

// ── Character color mapping ──
const CHAR_COLORS = {};
const COLOR_PALETTE = [
  '#e94560','#0f0','#ff0','#0af','#f90','#f0f','#89b4fa','#fab387',
  '#a6e3a1','#f38ba8','#94e2d5','#cba6f7','#f9e2af','#74c7ec','#eba0ac'
];
function charColor(ch){
  if(!CHAR_COLORS[ch]){
    const idx = Object.keys(CHAR_COLORS).length % COLOR_PALETTE.length;
    CHAR_COLORS[ch] = COLOR_PALETTE[idx];
  }
  return CHAR_COLORS[ch];
}

// ── Image List ──
async function loadImageList(){
  try{
    const params = new URLSearchParams({
      skip: listSkip,
      limit: 200,
      filter: listFilter,
      dataset: listDataset,
      search: listSearch
    });
    const data = await fetchJson(`${API}/images?${params}`);
    images = data.images || [];
    imagesTotal = data.total || 0;
  } catch(e){
    images = [];
    imagesTotal = 0;
    showToast('Failed to load images: ' + e.message, 'error');
  }
  renderFileList();
}

async function loadStats(){
  try{
    const data = await fetchJson(`${API}/stats`);
    $('statsBar').innerHTML =
      `<span class="stat-total">${data.total} total</span>` +
      `<span class="stat-extracted">${data.extracted} extracted</span>` +
      `<span class="stat-skipped">${data.skipped} skipped</span>` +
      `<span>${data.letter_count} letters</span>` +
      `<span>${data.unique_letters} unique</span>`;
    // Populate dataset dropdown
    const sel = $('datasetFilter');
    const curVal = sel.value;
    const ds = data.datasets || {};
    sel.innerHTML = '<option value="">All Datasets</option>';
    Object.keys(ds).sort().forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = `${name} (${ds[name].total})`;
      sel.appendChild(opt);
    });
    sel.value = curVal;
  } catch(e){}
}

function renderFileList(){
  const list = $('fileList');
  list.innerHTML = '';
  images.forEach(img => {
    const el = document.createElement('div');
    el.className = 'fi';
    if(img.stem === currentStem){
      if(modified) el.classList.add('modified');
      else if(img.skipped) el.classList.add('skipped');
      else el.classList.add('extracted');
    } else if(img.skipped){
      el.classList.add('skipped');
    } else {
      el.classList.add('extracted');
    }
    if(img.stem === currentStem) el.classList.add('active');
    const thumbSrc = `${API}/source-image/${encodeURIComponent(img.stem)}`;
    el.innerHTML = `<img class="thumb" src="${thumbSrc}" alt="" loading="lazy">` +
      `<span class="fn" title="${escHtml(img.stem)}">${escHtml(img.stem)}</span>` +
      `<span class="sc">${img.segment_count}</span>` +
      (img.skipped ? '<span class="skipped-badge">SKIP</span>' : '');
    el.addEventListener('click', () => selectImage(img.stem));
    list.appendChild(el);
  });
  // Scroll active into view
  const active = list.querySelector('.fi.active');
  if(active) active.scrollIntoView({block:'nearest'});
}

function updateFileListItem(){
  if(!currentStem) return;
  const list = $('fileList');
  const items = list.querySelectorAll('.fi');
  const idx = images.findIndex(i => i.stem === currentStem);
  if(idx < 0 || !items[idx]) return;
  const el = items[idx];
  el.classList.remove('extracted','skipped','modified');
  if(modified) el.classList.add('modified');
  else if(currentData?.skipped) el.classList.add('skipped');
  else el.classList.add('extracted');
}

// ── Load Image ──
async function selectImage(stem){
  if(modified && currentStem) await saveChanges();
  currentStem = stem;
  selectedIdx = -1;
  modified = false;
  removeInlineEdit();
  try{
    const data = await fetchJson(`${API}/image/${encodeURIComponent(stem)}`);
    currentData = data;
    segments = JSON.parse(JSON.stringify(data.segments || []));
    wordBoxes = data.word_boxes || [];
    // Load source image
    $('mainImg').src = `${API}/source-image/${encodeURIComponent(stem)}`;
    // Update right panel
    $('infoDataset').textContent = data.dataset || '—';
    $('infoMethod').textContent = data.method || '—';
    $('infoLabel').value = data.label || '';
    $('infoSkip').textContent = data.skipped ? (data.skip_reason || 'yes') : 'no';
    updateSkipBtn();
    renderSegments();
    renderWordBoxes();
    renderFileList();
    resetZoom();
  } catch(e){
    showToast('Failed to load image: ' + e.message, 'error');
  }
  updateStatus();
}

function updateSkipBtn(){
  if(currentData?.skipped){
    $('btnSkip').textContent = '⊘ Unskip';
    $('btnSkip').classList.add('active');
  } else {
    $('btnSkip').textContent = '⊘ Skip';
    $('btnSkip').classList.remove('active');
  }
}

// ── Render segments on image ──
function renderBoxes(){
  const overlay = $('boxesOverlay');
  overlay.innerHTML = '';
  const img = $('mainImg');
  if(!img.naturalWidth || !img.complete || !currentData) return;

  segments.forEach((seg, i) => {
    const color = charColor(seg.char);
    // Segment box
    const box = document.createElement('div');
    box.className = 'box' + (i === selectedIdx ? ' selected' : '');
    box.style.left = seg.x1 + 'px';
    box.style.top = seg.y1 + 'px';
    box.style.width = (seg.x2 - seg.x1) + 'px';
    box.style.height = (seg.y2 - seg.y1) + 'px';
    box.style.borderColor = color;
    box.style.background = color + '15';
    box.dataset.i = i;
    // Label
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    if(seg.y1 < 18) lbl.classList.add('below');
    lbl.textContent = seg.char || '?';
    lbl.style.background = color + 'cc';
    box.appendChild(lbl);
    // Resize handles for selected
    if(i === selectedIdx){
      ['tl','tr','bl','br','tm','bm','ml','mr'].forEach(h => {
        const rh = document.createElement('div');
        rh.className = 'rh ' + h;
        rh.dataset.handle = h;
        box.appendChild(rh);
      });
    }
    box.addEventListener('mousedown', e => onBoxMouseDown(e, i));
    box.addEventListener('dblclick', e => onBoxDblClick(e, i));
    overlay.appendChild(box);
  });

  // Word boxes (dashed, non-interactive)
  wordBoxes.forEach(wb => {
    const box = document.createElement('div');
    box.className = 'word-box';
    box.style.left = wb.x1 + 'px';
    box.style.top = wb.y1 + 'px';
    box.style.width = (wb.x2 - wb.x1) + 'px';
    box.style.height = (wb.y2 - wb.y1) + 'px';
    overlay.appendChild(box);
  });
}

function applyZoom(){
  const c = $('imgContainer');
  c.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  renderBoxes();
}

function resetZoom(){
  zoom = 1;
  panX = 0;
  panY = 0;
  applyZoom();
}

$('mainImg').addEventListener('load', () => {
  // Fit image to viewport
  const wrap = $('imgWrap');
  const img = $('mainImg');
  if(img.naturalWidth && img.naturalHeight){
    const ww = wrap.clientWidth - 40;
    const wh = wrap.clientHeight - 40;
    const fitZoom = Math.min(ww / img.naturalWidth, wh / img.naturalHeight, 1);
    zoom = fitZoom;
    panX = 0;
    panY = 0;
    applyZoom();
  }
  renderBoxes();
});
window.addEventListener('resize', () => { renderBoxes(); });

// ── Coordinate conversion ──
function getImgCoords(e){
  const img = $('mainImg');
  const rect = img.getBoundingClientRect();
  const scaleX = img.naturalWidth / rect.width;
  const scaleY = img.naturalHeight / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

// ── Box mouse interactions ──
function onBoxMouseDown(e, idx){
  e.stopPropagation();
  removeInlineEdit();
  const handle = e.target.dataset?.handle;
  selectedIdx = idx;
  renderSegments();
  renderBoxes();
  const seg = segments[idx];
  if(!seg) return;
  dragging = true;
  dragStartMouse = getImgCoords(e);
  dragOrigSeg = {x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2};
  if(handle){
    dragType = 'resize-' + handle;
  } else {
    dragType = 'move';
  }
}

function onBoxDblClick(e, idx){
  e.stopPropagation();
  e.preventDefault();
  startInlineEdit(idx);
}

// ── Inline character edit on box ──
function startInlineEdit(idx){
  removeInlineEdit();
  const seg = segments[idx];
  if(!seg) return;
  const img = $('mainImg');
  const rect = img.getBoundingClientRect();
  const scaleX = rect.width / img.naturalWidth;
  const scaleY = rect.height / img.naturalHeight;
  const cx = (seg.x1 + seg.x2) / 2 * scaleX * zoom + $('imgContainer').offsetLeft + panX;
  const cy = seg.y1 * scaleY * zoom + $('imgContainer').offsetTop + panY - 10;
  const wrap = $('imgWrap').getBoundingClientRect();
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'inline-edit';
  input.maxLength = 1;
  input.value = seg.char || '';
  input.style.left = (cx - wrap.left - 15) + 'px';
  input.style.top = (cy - wrap.top) + 'px';
  input.dataset.idx = idx;
  $('imgWrap').appendChild(input);
  input.focus();
  input.select();
  inlineEditEl = input;
  input.addEventListener('keydown', ev => {
    if(ev.key === 'Enter' || ev.key === 'Escape'){
      ev.preventDefault();
      finishInlineEdit();
    }
  });
  input.addEventListener('blur', () => {
    setTimeout(finishInlineEdit, 50);
  });
  input.addEventListener('input', () => {
    const i = parseInt(input.dataset.idx);
    if(i >= 0 && i < segments.length){
      segments[i].char = input.value || '?';
      setModified(true);
      renderBoxes();
      renderSegments();
    }
  });
}

function removeInlineEdit(){
  if(inlineEditEl){
    inlineEditEl.remove();
    inlineEditEl = null;
  }
}

function finishInlineEdit(){
  if(!inlineEditEl) return;
  const i = parseInt(inlineEditEl.dataset.idx);
  if(i >= 0 && i < segments.length){
    segments[i].char = inlineEditEl.value || '?';
  }
  removeInlineEdit();
  setModified(true);
  renderBoxes();
  renderSegments();
}

// ── Drawing new boxes ──
$('imgWrap').addEventListener('mousedown', e => {
  if(e.target !== $('mainImg') && e.target !== $('boxesOverlay') && e.target !== $('imgContainer')) return;
  if(e.button === 1 || (e.button === 0 && e.shiftKey)){
    // Pan
    e.preventDefault();
    panning = true;
    panStart = {x: e.clientX, y: e.clientY};
    panStartOffset = {x: panX, y: panY};
    return;
  }
  if(drawMode && e.button === 0){
    e.preventDefault();
    drawing = true;
    drawStart = getImgCoords(e);
    drawCurrent = {...drawStart};
    $('drawBox').style.display = 'block';
    updateDrawBox();
  } else if(!drawMode && e.button === 0){
    selectedIdx = -1;
    removeInlineEdit();
    renderSegments();
    renderBoxes();
  }
});

function updateDrawBox(){
  if(!drawStart || !drawCurrent) return;
  const s = drawStart, c = drawCurrent;
  const x = Math.min(s.x, c.x);
  const y = Math.min(s.y, c.y);
  const w = Math.abs(c.x - s.x);
  const h = Math.abs(c.y - s.y);
  const db = $('drawBox');
  db.style.left = x + 'px';
  db.style.top = y + 'px';
  db.style.width = w + 'px';
  db.style.height = h + 'px';
}

document.addEventListener('mousemove', e => {
  // Panning
  if(panning){
    panX = panStartOffset.x + (e.clientX - panStart.x);
    panY = panStartOffset.y + (e.clientY - panStart.y);
    applyZoom();
    return;
  }

  // Drawing
  if(drawing && drawMode){
    drawCurrent = getImgCoords(e);
    updateDrawBox();
    return;
  }

  // Dragging
  if(!dragging || selectedIdx < 0) return;
  const seg = segments[selectedIdx];
  if(!seg) return;
  const pos = getImgCoords(e);
  const dx = pos.x - dragStartMouse.x;
  const dy = pos.y - dragStartMouse.y;

  if(dragType === 'move'){
    seg.x1 = Math.round(dragOrigSeg.x1 + dx);
    seg.y1 = Math.round(dragOrigSeg.y1 + dy);
    seg.x2 = Math.round(dragOrigSeg.x2 + dx);
    seg.y2 = Math.round(dragOrigSeg.y2 + dy);
  } else if(dragType.startsWith('resize-')){
    const h = dragType.slice(7);
    let nx1 = dragOrigSeg.x1, ny1 = dragOrigSeg.y1, nx2 = dragOrigSeg.x2, ny2 = dragOrigSeg.y2;
    if(h.includes('l')){ nx1 = Math.round(dragOrigSeg.x1 + dx); }
    if(h.includes('r')){ nx2 = Math.round(dragOrigSeg.x2 + dx); }
    if(h.includes('t')){ ny1 = Math.round(dragOrigSeg.y1 + dy); }
    if(h.includes('b')){ ny2 = Math.round(dragOrigSeg.y2 + dy); }
    // Enforce min size
    if(nx2 - nx1 < 3) nx2 = nx1 + 3;
    if(ny2 - ny1 < 3) ny2 = ny1 + 3;
    seg.x1 = nx1; seg.y1 = ny1; seg.x2 = nx2; seg.y2 = ny2;
  }
  renderBoxes();
  setModified(true);
});

document.addEventListener('mouseup', e => {
  // Pan end
  if(panning){
    panning = false;
    return;
  }

  // Draw end
  if(drawing && drawMode){
    drawing = false;
    $('drawBox').style.display = 'none';
    if(drawStart && drawCurrent){
      const x1 = Math.min(drawStart.x, drawCurrent.x);
      const y1 = Math.min(drawStart.y, drawCurrent.y);
      const x2 = Math.max(drawStart.x, drawCurrent.x);
      const y2 = Math.max(drawStart.y, drawCurrent.y);
      if(x2 - x1 >= 3 && y2 - y1 >= 3){
        // Add new segment via API
        addNewSegment(Math.round(x1), Math.round(y1), Math.round(x2), Math.round(y2));
      }
    }
    drawStart = null;
    drawCurrent = null;
    return;
  }

  // Drag end
  if(dragging){
    dragging = false;
    dragType = null;
    renderBoxes();
    renderSegments();
  }
});

// ── Add segment via API ──
async function addNewSegment(x1, y1, x2, y2){
  if(!currentStem) return;
  try{
    const result = await postJson(`${API}/image/${encodeURIComponent(currentStem)}/add-box`, {
      char: '?', x1, y1, x2, y2
    });
    // Reload image data to get updated out_paths
    await reloadCurrentImage();
    // Select the new segment
    selectedIdx = segments.length - 1;
    renderSegments();
    renderBoxes();
    showToast('Segment added', 'success');
  } catch(e){
    showToast('Failed to add segment: ' + e.message, 'error');
  }
}

async function reloadCurrentImage(){
  if(!currentStem) return;
  const data = await fetchJson(`${API}/image/${encodeURIComponent(currentStem)}`);
  currentData = data;
  segments = JSON.parse(JSON.stringify(data.segments || []));
  wordBoxes = data.word_boxes || [];
  modified = false;
}

// ── Render segments list (right panel) ──
function renderSegments(){
  const list = $('segmentsList');
  list.innerHTML = '';
  $('segCount').textContent = segments.length;
  segments.forEach((seg, i) => {
    const el = document.createElement('div');
    el.className = 'seg-item' + (i === selectedIdx ? ' selected' : '');
    const color = charColor(seg.char);
    el.style.borderLeftColor = color;
    // Letter crop thumbnail
    let cropHtml;
    if(seg.out_path){
      const parts = seg.out_path.split('/');
      const fname = parts[parts.length - 1];
      const charDir = encodeURIComponent(seg.char || '?');
      const cropSrc = `${API}/letter-image/${charDir}/${encodeURIComponent(fname)}`;
      cropHtml = `<img class="seg-crop" src="${cropSrc}" alt="" loading="lazy">`;
    } else {
      cropHtml = `<div class="seg-crop-placeholder">${escHtml(seg.char || '?')}</div>`;
    }
    el.innerHTML = cropHtml +
      `<div class="seg-fields">` +
        `<input type="text" class="seg-char" value="${escHtml(seg.char || '')}" data-i="${i}" maxlength="1">` +
        `<div class="seg-coords">${seg.x1},${seg.y1} → ${seg.x2},${seg.y2}</div>` +
      `</div>` +
      `<button class="seg-del" data-i="${i}" title="Delete segment">×</button>`;
    el.addEventListener('click', e => {
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      selectedIdx = i;
      renderSegments();
      renderBoxes();
      scrollToBox(i);
    });
    list.appendChild(el);
  });
  // Attach events
  list.querySelectorAll('.seg-char').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = parseInt(e.target.dataset.i);
      if(i >= 0 && i < segments.length){
        segments[i].char = e.target.value || '?';
        setModified(true);
        renderBoxes();
      }
    });
    inp.addEventListener('focus', e => {
      const i = parseInt(e.target.dataset.i);
      selectedIdx = i;
      renderSegments();
      renderBoxes();
    });
  });
  list.querySelectorAll('.seg-del').forEach(btn => {
    btn.addEventListener('click', async e => {
      const i = parseInt(e.target.dataset.i);
      await deleteSegment(i);
    });
  });
}

function scrollToBox(idx){
  const boxes = $('boxesOverlay').querySelectorAll('.box');
  if(boxes[idx]){
    boxes[idx].scrollIntoView({block:'center',inline:'center',behavior:'smooth'});
  }
}

// ── Render word boxes (right panel) ──
function renderWordBoxes(){
  const list = $('wbList');
  list.innerHTML = '';
  $('wbCount').textContent = wordBoxes.length;
  wordBoxes.forEach(wb => {
    const el = document.createElement('div');
    el.className = 'wb-item';
    el.textContent = `"${wb.text || ''}" [${wb.x1},${wb.y1} → ${wb.x2},${wb.y2}]`;
    list.appendChild(el);
  });
}

// ── Delete segment ──
async function deleteSegment(idx){
  if(!currentStem) return;
  try{
    await delJson(`${API}/image/${encodeURIComponent(currentStem)}/segment/${idx}`);
    await reloadCurrentImage();
    if(selectedIdx >= segments.length) selectedIdx = segments.length - 1;
    renderSegments();
    renderBoxes();
    showToast('Segment deleted', 'success');
  } catch(e){
    showToast('Failed to delete: ' + e.message, 'error');
  }
}

// ── Save ──
async function saveChanges(){
  if(!currentStem) return;
  try{
    $('statusText').textContent = 'Saving...';
    await postJson(`${API}/image/${encodeURIComponent(currentStem)}`, {
      segments: segments,
      label: $('infoLabel').value
    });
    modified = false;
    await reloadCurrentImage();
    $('infoLabel').value = currentData.label || '';
    $('infoSkip').textContent = currentData.skipped ? (currentData.skip_reason || 'yes') : 'no';
    updateSkipBtn();
    renderSegments();
    renderBoxes();
    updateStatus();
    updateFileListItem();
    loadStats();
    loadImageList();
    showToast('Saved', 'success');
  } catch(e){
    showToast('Save failed: ' + e.message, 'error');
    updateStatus();
  }
}

// ── Skip/Unskip ──
async function toggleSkip(){
  if(!currentStem || !currentData) return;
  const newSkip = !currentData.skipped;
  try{
    await postJson(`${API}/image/${encodeURIComponent(currentStem)}/skip`, {
      skip: newSkip,
      reason: 'manual'
    });
    await reloadCurrentImage();
    $('infoSkip').textContent = currentData.skipped ? (currentData.skip_reason || 'yes') : 'no';
    updateSkipBtn();
    modified = false;
    renderSegments();
    renderBoxes();
    updateStatus();
    updateFileListItem();
    loadStats();
    loadImageList();
    showToast(newSkip ? 'Skipped' : 'Unskipped', 'success');
  } catch(e){
    showToast('Failed: ' + e.message, 'error');
  }
}

// ── Navigation ──
function navigate(dir){
  if(!currentStem){
    if(images.length > 0) selectImage(images[0].stem);
    return;
  }
  const curIdx = images.findIndex(i => i.stem === currentStem);
  const next = curIdx + dir;
  if(next < 0 || next >= images.length) return;
  selectImage(images[next].stem);
}

// ── Zoom ──
function zoomBy(delta){
  zoom = Math.max(0.1, Math.min(10, zoom + delta));
  applyZoom();
  updateStatus();
}

$('imgWrap').addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  // Zoom towards mouse position
  const rect = $('imgWrap').getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const oldZoom = zoom;
  zoom = Math.max(0.1, Math.min(10, zoom + delta * zoom));
  const ratio = zoom / oldZoom;
  panX = mx - ratio * (mx - panX);
  panY = my - ratio * (my - panY);
  applyZoom();
  updateStatus();
}, {passive: false});

// ── Toolbar button events ──
$('btnPrev').addEventListener('click', () => navigate(-1));
$('btnNext').addEventListener('click', () => navigate(1));
$('btnSave').addEventListener('click', () => saveChanges());
$('btnSkip').addEventListener('click', () => toggleSkip());
$('btnDraw').addEventListener('click', () => {
  drawMode = !drawMode;
  $('btnDraw').classList.toggle('active', drawMode);
  $('mainImg').style.cursor = drawMode ? 'crosshair' : 'default';
  if(!drawMode){
    drawing = false;
    drawStart = null;
    drawCurrent = null;
    $('drawBox').style.display = 'none';
  }
});
$('btnZoomIn').addEventListener('click', () => zoomBy(0.2));
$('btnZoomOut').addEventListener('click', () => zoomBy(-0.2));
$('btnZoomFit').addEventListener('click', resetZoom);
$('btnCopyImg').addEventListener('click', copyOriginalImage);

async function copyOriginalImage(){
  if(!currentStem) return;
  try{
    const img = $('mainImg');
    if(!img.naturalWidth) throw new Error('Image not loaded');
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    showToast('Image copied to clipboard', 'success');
  } catch(e){
    showToast('Copy failed: ' + e.message, 'error');
  }
}

// ── Filter events ──
$('datasetFilter').addEventListener('change', e => {
  listDataset = e.target.value;
  listSkip = 0;
  loadImageList();
});
$('searchInput').addEventListener('input', e => {
  listSearch = e.target.value.trim();
  listSkip = 0;
  loadImageList();
});
$('filterAll').addEventListener('click', () => setFilter('all'));
$('filterExtracted').addEventListener('click', () => setFilter('extracted'));
$('filterSkipped').addEventListener('click', () => setFilter('skipped'));

function setFilter(f){
  listFilter = f;
  listSkip = 0;
  $('filterAll').classList.toggle('active', f === 'all');
  $('filterExtracted').classList.toggle('active', f === 'extracted');
  $('filterSkipped').classList.toggle('active', f === 'skipped');
  loadImageList();
}

// ── Label edit ──
$('infoLabel').addEventListener('input', () => setModified(true));

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); navigate(-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); navigate(1); }
  else if(e.key === 'Delete' && selectedIdx >= 0){
    e.preventDefault();
    deleteSegment(selectedIdx);
  }
  else if(e.key === 'd' || e.key === 'D'){
    drawMode = !drawMode;
    $('btnDraw').classList.toggle('active', drawMode);
    $('mainImg').style.cursor = drawMode ? 'crosshair' : 'default';
    if(!drawMode){
      drawing = false;
      drawStart = null;
      drawCurrent = null;
      $('drawBox').style.display = 'none';
    }
  }
  else if(e.key === 's' && !e.ctrlKey){
    toggleSkip();
  }
  else if(e.ctrlKey && e.key === 's'){
    e.preventDefault();
    saveChanges();
  }
  else if(e.key === '+' || e.key === '='){
    zoomBy(0.2);
  }
  else if(e.key === '-'){
    zoomBy(-0.2);
  }
  else if(e.key === '0'){
    resetZoom();
  }
  else if(e.key === 'c' || e.key === 'C'){
    copyOriginalImage();
  }
  else if(e.key === 'Escape'){
    if(drawMode){
      drawMode = false;
      $('btnDraw').classList.toggle('active', false);
      $('mainImg').style.cursor = 'default';
      drawing = false;
      drawStart = null;
      drawCurrent = null;
      $('drawBox').style.display = 'none';
    } else {
      selectedIdx = -1;
      removeInlineEdit();
      renderSegments();
      renderBoxes();
    }
  }
});

// ── Init ──
loadStats();
loadImageList();
</script>
</body>
